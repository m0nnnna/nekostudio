<title>Ultimit Mine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-screen fake desktop. Left icon rail, generative shard wallpaper,
   bracketed wordmark bottom-right, draggable glass windows, news ticker. Skins swap tokens. */
:root {
  --bg1: #050607; --bg2: #1c2026;
  --panel: rgba(13,15,18,.80); --panel-2: rgba(255,255,255,.05);
  --rail: rgba(7,8,10,.86);
  --fg: #eef1f4; --dim: #8d949e;
  --line: rgba(235,240,245,.16); --line-strong: rgba(235,240,245,.48);
  --accent: #d4ebff; --on-accent: #07090b;
  --ok: #8fe3b0; --warn: #ffd98f; --bad: #ff8a8a;
  --shard: 246,248,251; --edge: 255,255,255; --shade: 0,0,0; --hexc: 255,255,255;
  --display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --railw: 84px;
  color-scheme: dark;
}
:root[data-skin="amber"] {
  --bg1: #b84d05; --bg2: #f8cf96;
  --panel: rgba(34,17,5,.78); --panel-2: rgba(255,220,180,.07);
  --rail: rgba(28,13,3,.86);
  --fg: #fff4e6; --dim: #dcb48c;
  --line: rgba(255,226,196,.2); --line-strong: rgba(255,226,196,.55);
  --accent: #ffb04a; --on-accent: #2a1404;
  --shard: 255,250,242; --edge: 255,255,255; --shade: 120,50,0; --hexc: 255,240,220;
  color-scheme: dark;
}
:root[data-skin="silver"] {
  --bg1: #f6f7f9; --bg2: #aeb5bf;
  --panel: rgba(248,249,251,.82); --panel-2: rgba(20,30,45,.05);
  --rail: rgba(232,235,239,.9);
  --fg: #14171b; --dim: #5a626d;
  --line: rgba(20,24,30,.16); --line-strong: rgba(20,24,30,.5);
  --accent: #2c5b88; --on-accent: #ffffff;
  --ok: #1f8a52; --warn: #a66b00; --bad: #c0392b;
  --shard: 255,255,255; --edge: 70,82,98; --shade: 60,72,90; --hexc: 40,50,65;
  color-scheme: light;
}
:root[data-skin="verdant"] {
  --bg1: #062a0c; --bg2: #79d24f;
  --panel: rgba(5,20,8,.78); --panel-2: rgba(200,255,180,.06);
  --rail: rgba(3,14,5,.86);
  --fg: #effbe9; --dim: #a3cc95;
  --line: rgba(220,255,205,.18); --line-strong: rgba(220,255,205,.5);
  --accent: #b9ff8c; --on-accent: #082008;
  --shard: 242,255,236; --edge: 255,255,255; --shade: 0,40,0; --hexc: 230,255,220;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg1); color: var(--fg); font-family: var(--ui); font-size: 14px; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

#os { position: relative; height: 100%; overflow: hidden; }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---- rail ---- */
#rail { position: absolute; left: 0; top: 0; bottom: 0; width: var(--railw); z-index: 5000;
  background: var(--rail); border-right: 1px solid var(--line); backdrop-filter: blur(10px);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 14px; }
#rail .emb { width: 40px; height: 40px; color: var(--fg); margin-bottom: 14px; background: none; border: 0; padding: 0; cursor: pointer; }
.rb { width: 72px; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: 0; cursor: pointer; position: relative; color: var(--fg); }
.rb svg { width: 26px; height: 26px; }
.rb span { font-weight: 600; font-size: 9px; letter-spacing: .18em; }
.rb:hover { background: var(--panel-2); }
.rb.on::before { content: ""; position: absolute; left: -6px; top: 12px; bottom: 12px; width: 3px; background: var(--accent); }
#rail .grow { flex: 1; }
#rail .ver { font: 9px var(--mono); color: var(--dim); letter-spacing: .1em; writing-mode: vertical-rl; transform: rotate(180deg); }

/* ---- status / wordmark / ticker ---- */
#status { position: absolute; right: 24px; top: 16px; text-align: right; z-index: 2; font-family: var(--mono); pointer-events: none; }
#status .t { font-size: 26px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
#status .d { font-size: 11px; letter-spacing: .22em; color: var(--dim); }
#status .sys { margin-top: 6px; display: flex; gap: 14px; justify-content: flex-end; font-size: 10px; letter-spacing: .14em; color: var(--dim); }
#status .sys b { color: var(--ok); font-weight: 400; }
#mark { position: absolute; right: 30px; bottom: 50px; z-index: 1; text-align: right; pointer-events: none; }
#mark .w { font-family: var(--display); font-size: clamp(28px, 4.2vw, 54px); letter-spacing: .14em; white-space: nowrap; }
#mark .w i { font-style: normal; font-family: var(--ui); font-weight: 400; color: var(--dim); }
#mark .c { font: 10px var(--mono); letter-spacing: .5em; color: var(--dim); margin-top: 2px; }
#ticker { position: absolute; left: var(--railw); right: 0; bottom: 0; height: 26px; z-index: 4999; display: flex; align-items: center;
  background: var(--rail); border-top: 1px solid var(--line); font: 11px var(--mono); letter-spacing: .08em; overflow: hidden; }
#ticker .k { padding: 0 12px 0 16px; color: var(--on-accent); background: var(--accent); height: 100%; display: flex; align-items: center; letter-spacing: .2em; flex: none; }
#ticker .m { white-space: nowrap; padding-left: 100%; animation: tick 48s linear infinite; color: var(--dim); }
#ticker .m span { color: var(--fg); margin: 0 10px 0 0; }
@keyframes tick { to { transform: translateX(-100%); } }

/* ---- orbit shortcuts ---- */
.orb { position: absolute; z-index: 3; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px); transition: transform .2s; }
.orb svg { width: 20px; height: 20px; }
.orb:hover { transform: scale(1.12); border-color: var(--accent); }
.orb::after { content: attr(data-label); position: absolute; left: 54px; top: 50%; transform: translateY(-50%);
  font: 600 10px var(--ui); letter-spacing: .2em; white-space: nowrap; opacity: 0; transition: opacity .2s; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.orb:hover::after, .orb:focus-visible::after { opacity: 1; }

/* ---- windows ---- */
.win { position: absolute; display: flex; flex-direction: column; min-width: 300px; max-width: calc(100% - var(--railw) - 16px);
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(1.25);
  box-shadow: 0 24px 70px rgba(0,0,0,.38); animation: winIn .42s cubic-bezier(.2,.8,.2,1); }
.win.focus { border-color: var(--line-strong); }
.win::before, .win::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; }
.win::before { left: -1px; top: -1px; border-left: 2px solid var(--accent); border-top: 2px solid var(--accent); }
.win::after { right: -1px; bottom: -1px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); }
.win.closing { animation: winOut .3s ease-in forwards; }
.win.min { display: none; }
@keyframes winIn { 0% { clip-path: inset(0 50% calc(100% - 2px) 50%); opacity: .3; } 45% { clip-path: inset(0 0 calc(100% - 2px) 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); } }
@keyframes winOut { 0% { clip-path: inset(0 0 0 0); } 55% { clip-path: inset(0 0 calc(100% - 2px) 0); opacity: 1; } 100% { clip-path: inset(0 50% calc(100% - 2px) 50%); opacity: 0; } }
.wh { display: flex; align-items: center; gap: 12px; padding: 12px 10px 10px 16px; cursor: grab; user-select: none; touch-action: none; }
.wh:active { cursor: grabbing; }
.wt { font-family: var(--display); font-size: 17px; letter-spacing: .05em; white-space: nowrap; }
.wsub { font: 10px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .16em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wrule { flex: 1; height: 1px; min-width: 10px; background: linear-gradient(90deg, var(--line-strong), transparent); }
.wb { font: 12px var(--mono); color: var(--dim); background: none; border: 0; padding: 4px 6px; cursor: pointer; white-space: nowrap; }
.wb:hover { color: var(--fg); }
.wc { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }

.lbl { font: 10px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.lbl::before { content: ""; width: 6px; height: 6px; background: var(--accent); flex: none; }
.lbl em { font-style: normal; margin-left: auto; letter-spacing: .1em; }
.btn { font: 600 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; padding: 9px 16px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--fg);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.btn:hover { background: var(--panel-2); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.chip { font: 10px var(--mono); letter-spacing: .12em; padding: 2px 7px; border: 1px solid currentColor; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.dim { color: var(--dim); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; min-height: 0; flex: 1; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; gap: 2px 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.row:hover { background: var(--panel-2); }
.row.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
.mute { color: var(--dim); }
.mono { font-family: var(--mono); }
.field { display: grid; gap: 6px; }
.field label { font: 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
select, input[type="range"] { width: 100%; }
select { background: var(--panel-2); border: 1px solid var(--line); padding: 7px 8px; }
select option { background: var(--bg1); color: var(--fg); }
input[type="range"] { accent-color: var(--accent); }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.tog input { appearance: none; width: 34px; height: 16px; border: 1px solid var(--line-strong); position: relative; cursor: pointer; flex: none; margin: 0; }
.tog input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--dim); transition: left .15s, background .15s; }
.tog input:checked::after { left: 20px; background: var(--accent); }

/* games */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.tile { aspect-ratio: 3 / 4; max-width: 100%; position: relative; border: 1px solid var(--line); cursor: pointer; padding: 0; overflow: hidden; background: var(--panel-2); text-align: left; }
.tile .art { position: absolute; inset: 0; }
.tile .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px; font-weight: 600; font-size: 12px; line-height: 1.2; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.78)); }
.tile.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile:hover .art { transform: scale(1.04); }
.tile .art { transition: transform .3s; }
.gd { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.gd .hero { height: 110px; position: relative; border: 1px solid var(--line); overflow: hidden; }
.gd h3 { margin: 0; font-family: var(--display); font-size: 16px; letter-spacing: .03em; text-wrap: balance; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; }
.kv dt { font: 10px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; padding-top: 2px; }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* mail */
.mrow { grid-template-columns: 8px minmax(0, 1fr) auto; }
.mrow .dot { width: 6px; height: 6px; margin-top: 6px; }
.mrow.unread .dot { background: var(--accent); }
.mrow .fr { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .sb { grid-column: 2 / 4; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .tm { font: 11px var(--mono); color: var(--dim); }
.read { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.read h3 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.read .hd { font: 11px var(--mono); color: var(--dim); letter-spacing: .06em; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.read p { margin: 0; line-height: 1.6; max-width: 62ch; }

/* news */
.feat { position: relative; min-height: 170px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: flex-end; }
.feat canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.feat .cap { position: relative; padding: 16px; display: grid; gap: 6px; background: linear-gradient(transparent, rgba(0,0,0,.6)); width: 100%; color: #fff; }
.feat .cap h3 { margin: 0; font-family: var(--display); font-size: 16px; text-wrap: balance; letter-spacing: .02em; }
.feat .play { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.7); display: grid; place-items: center; color: #fff; }
.nrow { grid-template-columns: 54px minmax(0, 1fr); }
.nrow .tm { font: 11px var(--mono); color: var(--dim); padding-top: 2px; }
.nrow b { font-weight: 600; font-size: 13px; }
.nrow p { margin: 2px 0 0; font-size: 12px; color: var(--dim); line-height: 1.5; }

/* audio */
.viz { height: 120px; border: 1px solid var(--line); position: relative; }
.viz canvas { width: 100%; height: 100%; display: block; }
.trk { grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; }
.trk .n { font: 12px var(--mono); color: var(--dim); }
.trk.sel .n { color: var(--accent); }
.ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ctl .field { flex: 1; min-width: 140px; }

/* data */
.drow { grid-template-columns: 22px minmax(0, 1fr) 80px 90px; align-items: center; font-size: 13px; }
.drow svg { width: 16px; height: 16px; color: var(--dim); }
.drow .s, .drow .m { font: 11px var(--mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.crumb { font: 12px var(--mono); letter-spacing: .06em; display: flex; gap: 6px; flex-wrap: wrap; }
.crumb span { color: var(--dim); }
.meter { height: 6px; background: var(--panel-2); border: 1px solid var(--line); position: relative; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* accessory */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.skin { border: 1px solid var(--line); padding: 0; cursor: pointer; background: none; text-align: left; display: flex; flex-direction: column; }
.skin .pv { height: 64px; position: relative; overflow: hidden; }
.skin .pv i { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; }
.skin .nm { padding: 8px 10px; font: 600 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; }
.skin.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 12px; color: var(--dim); line-height: 1.6; max-width: 62ch; margin: 0; }

/* toasts */
#toasts { position: absolute; right: 20px; top: 104px; z-index: 6000; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100% - 40px)); pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--line-strong); padding: 10px 14px; backdrop-filter: blur(14px); font-size: 12px; line-height: 1.5;
  animation: winIn .35s cubic-bezier(.2,.8,.2,1); border-left: 3px solid var(--accent); }
.toast b { display: block; font: 10px var(--mono); letter-spacing: .2em; color: var(--dim); text-transform: uppercase; font-weight: 400; }

/* boot */
#boot { position: absolute; inset: 0; z-index: 9000; background: #000; color: #e9edf2; display: grid; place-items: center; cursor: pointer; transition: opacity .6s; }
#boot.out { opacity: 0; }
#boot .in { display: grid; justify-items: center; gap: 18px; padding: 16px; }
#boot svg { width: 84px; height: 84px; }
#boot svg path, #boot svg polygon { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
#boot .w { font-family: var(--display); font-size: 30px; letter-spacing: .2em; opacity: 0; animation: fade .6s 1.1s forwards; }
#boot pre { margin: 0; font: 11px/1.7 var(--mono); color: #8d949e; min-height: 9em; width: min(420px, 100%); white-space: pre-wrap; }
@keyframes fade { to { opacity: 1; } }

@media (max-width: 720px) {
  :root { --railw: 0px; }
  #rail { top: auto; bottom: 0; right: 0; width: auto; height: 66px; flex-direction: row; justify-content: space-around; padding: 0 6px; border-right: 0; border-top: 1px solid var(--line); }
  #rail .emb, #rail .grow, #rail .ver { display: none; }
  .rb { width: auto; flex: 1; padding: 8px 0; }
  .rb.on::before { left: 20%; right: 20%; top: -1px; bottom: auto; width: auto; height: 3px; }
  #ticker, .orb { display: none; }
  #status { left: 16px; right: 16px; top: 10px; text-align: left; }
  #status .t { font-size: 20px; } #status .sys { justify-content: flex-start; }
  #mark { right: 16px; bottom: 82px; }
  .win { left: 8px !important; right: 8px; top: 64px !important; bottom: 74px; width: auto !important; height: auto !important; min-width: 0; max-width: none; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .drow { grid-template-columns: 22px minmax(0, 1fr) 70px; } .drow .m { display: none; }
  #toasts { top: 70px; right: 16px; width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) {
  .win, .win.closing, .toast { animation: none; }
  #ticker .m { animation: none; padding-left: 16px; }
  #boot svg path, #boot svg polygon, #boot .w { animation-duration: .01s; animation-delay: 0s; }
}
</style>

<div id="os">
  <canvas id="wall" aria-hidden="true"></canvas>
  <div id="orbit"></div>

  <nav id="rail" aria-label="Applications">
    <button class="emb" id="embBtn" title="Replay boot sequence" aria-label="Replay boot sequence"></button>
  </nav>

  <div id="status" aria-live="off">
    <div class="t" id="clock">00:00:00</div>
    <div class="d" id="date">----.--.-- ---</div>
    <div class="sys"><span>NET <b>●</b></span><span>iGPU <b>●</b></span><span>NV 1650 <b>●</b></span><span>VOL 72</span></div>
  </div>

  <div id="mark"><div class="w"><i>[</i> ULTIMIT <i>]</i></div><div class="c">OPERATING SYSTEM · MINE</div></div>

  <div id="wins"></div>
  <div id="toasts" aria-live="polite"></div>

  <div id="ticker"><div class="k">NEWS</div><div class="m" id="tickm"></div></div>

  <div id="boot" hidden><div class="in"><div id="bootEmb"></div><div class="w">[ ULTIMIT ]</div><pre id="bootLog"></pre></div></div>
</div>

<script>
(() => {
const root = document.documentElement;
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html) e.innerHTML = html; return e; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- icons ---------- */
const I = {
  games: '<path d="M3 9l3-3h12l3 3v6l-3 3h-3l-2-2h-2l-2 2H6l-3-3z"/><path d="M8 10v4M6 12h4M15.5 11h.01M17.5 13h.01"/>',
  mailer: '<path d="M3 6h18v12H3z"/><path d="M3 6l9 7 9-7"/>',
  news: '<path d="M4 4h16v16H4z"/><path d="M8 16V8l8 8V8"/>',
  audio: '<path d="M3 12h2M7 8v8M11 4v16M15 9v6M19 11v2"/>',
  data: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
  accessory: '<path d="M12 3l9 16H3z"/><path d="M12 9.5l3.5 6.5h-7z"/>',
  folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
  file: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/>',
  play: '<path d="M8 5l11 7-11 7z"/>'
};
const svg = (k, sw = 1.5) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linejoin="miter" aria-hidden="true">${I[k]}</svg>`;

function emblem(sw = 1.6) {

/* ---------- audio synth ---------- */
function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ac = new AC(), master = ac.createGain(), filt = ac.createBiquadFilter(), an = ac.createAnalyser(), lfo = ac.createOscillator(), lg = ac.createGain();
  const vol = $("#a-vol"); master.gain.value = 0; master.gain.linearRampToValueAtTime((vol ? vol.value : 60) / 100 * .25, ac.currentTime + 1.5);
  filt.type = "lowpass"; filt.frequency.value = 900; filt.Q.value = 6; lfo.frequency.value = .08; lg.gain.value = 600; lfo.connect(lg); lg.connect(filt.frequency); lfo.start();
  an.fftSize = 256; filt.connect(master); master.connect(an); an.connect(ac.destination);
  const oscs = tracks[curTrack].f.flatMap((f, i) => [-6, 6].map(dt => { const o = ac.createOscillator(), g = ac.createGain(); o.type = tracks[curTrack].wave; o.frequency.value = f; o.detune.value = dt + i; g.gain.value = .12 / (i + 1); o.connect(g); g.connect(filt); o.start(); return o; }));
  audio = { ac, master, an, oscs: [...oscs, lfo] };
}
function stopAudio() { if (!audio) return; const a = audio; audio = null; a.master.gain.linearRampToValueAtTime(0, a.ac.currentTime + .3); setTimeout(() => a.ac.close(), 400); }

/* ---------- window manager ---------- */
const winsEl = $("#wins"), wins = {}; let z = 10;
const mobile = () => matchMedia("(max-width: 720px)").matches;
function railW() { return mobile() ? 0 : 84; }
function focusWin(id) { for (const k in wins) wins[k].classList.toggle("focus", k === id); wins[id].style.zIndex = ++z; }
function syncRail() { order.forEach(id => { const on = !!wins[id] && !wins[id].classList.contains("min"); document.querySelectorAll(`[data-app="${id}"]`).forEach(b => b.classList.toggle("on", on)); }); }
function openApp(id) {
  if (wins[id]) { wins[id].classList.remove("min"); focusWin(id); syncRail(); return; }
  const a = apps[id], rw = railW(), dw = innerWidth - rw, dh = innerHeight - 26;
  const w = Math.min(a.w, dw - 32), hh = Math.min(a.h, dh - 40);
  const x = a.x < 0 ? innerWidth - w - 40 : rw + 16 + a.x * Math.max(0, dw - w - 32), y = 20 + a.y * Math.max(0, dh - hh - 40);
  const win = h("section", { class: "win", role: "dialog", "aria-label": a.t });
  win.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${hh}px`;
  win.innerHTML = `<header class="wh"><span class="wt">${a.t}</span><span class="wsub">${a.sub}</span><span class="wrule"></span><button class="wb" data-act="min" aria-label="Minimize">[ _ ]</button><button class="wb" data-act="close" aria-label="Close">[ × ]</button></header><div class="wc"></div>`;
  winsEl.append(win); wins[id] = win; focusWin(id);
  win.addEventListener("pointerdown", () => focusWin(id));
  $("[data-act=min]", win).onclick = () => { win.classList.add("min"); syncRail(); };
  $("[data-act=close]", win).onclick = () => closeApp(id);
  drag(win, $(".wh", win));
  a.render($(".wc", win), win);
  syncRail();
}
function closeApp(id) {
  const win = wins[id]; if (!win) return; delete wins[id]; syncRail();
  if (id === "audio") cancelAnimationFrame(vizRAF);
  if (reduce) { win.remove(); return; }
  win.classList.add("closing"); win.addEventListener("animationend", () => win.remove(), { once: true });
}
function drag(win, handle) {
  let sx, sy, ox, oy, on = false;
  handle.addEventListener("pointerdown", e => { if (e.target.closest("button") || mobile()) return; on = true; sx = e.clientX; sy = e.clientY; ox = win.offsetLeft; oy = win.offsetTop; handle.setPointerCapture(e.pointerId); });
  handle.addEventListener("pointermove", e => { if (!on) return;
    const nx = Math.min(innerWidth - 80, Math.max(railW() - win.offsetWidth + 80, ox + e.clientX - sx)), ny = Math.min(innerHeight - 60, Math.max(0, oy + e.clientY - sy));
    win.style.left = nx + "px"; win.style.top = ny + "px"; });
  handle.addEventListener("pointerup", () => on = false);
  handle.addEventListener("dblclick", e => { if (e.target.closest("button") || mobile()) return;
    if (win.dataset.max) { const r = JSON.parse(win.dataset.max); Object.assign(win.style, r); delete win.dataset.max; }
    else { win.dataset.max = JSON.stringify({ left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height }); Object.assign(win.style, { left: railW() + 10 + "px", top: "10px", width: innerWidth - railW() - 20 + "px", height: innerHeight - 46 + "px" }); } });
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function readPal() { const cs = getComputedStyle(root), g = k => cs.getPropertyValue(k).trim(); pal = { bg1: g("--bg1"), bg2: g("--bg2"), shard: g("--shard"), edge: g("--edge"), shade: g("--shade"), hex: g("--hexc"), light: skin === "silver" }; }
function geo(w, h) { const rw = w < 720 ? 0 : 84; return { px: rw + (w - rw) * .30, py: h * .70, R: Math.min(w * .42, h * .62), sc: Math.max(.6, Math.min(w, h) / 800) }; }
function genShards() {
  const r = rng(7); shards = [];
  for (let i = 0; i < density; i++) { const k = i / (density - 1);
    shards.push({ a: -2.95 + k * 2.7 + (r() - .5) * .08, r0: .06 + r() * .26, L: (.45 + r() * .55) * (.55 + .65 * k), t: 5 + r() * 17, ph: r() * 6.28, al: .55 + r() * .45 }); }
  for (let i = 0; i < Math.round(density / 5); i++) shards.push({ a: .15 + r() * .7, r0: .1 + r() * .2, L: .2 + r() * .3, t: 4 + r() * 8, ph: r() * 6.28, al: .25 + r() * .25 });
}
function genHex(w, h) {
  const r = rng(11), s = 24 * Math.max(.7, Math.min(w, h) / 800), hw = Math.sqrt(3) * s; hexes = [];
  const cx = w * .8, cy = h * .2;
  for (let row = 0; row * s * 1.5 < h * .7; row++) for (let col = 0; col * hw < w * .55 + hw; col++) {
    const x = w * .45 + col * hw + (row % 2 ? hw / 2 : 0), y = row * s * 1.5, d = Math.hypot(x - cx, y - cy) / (Math.min(w, h) * .5);
    const al = .24 - d * .2; if (al > .02) hexes.push({ x, y, al, f: r() < .1 ? r() * 6.28 : -1 }); }

/* ---------- clock / ticker ---------- */
const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"], p2 = n => String(n).padStart(2, "0");

$("#tickm").innerHTML = news.map(n => `<span>${n.t}</span>${n.h}`).join("&nbsp;&nbsp;&nbsp;◆&nbsp;&nbsp;&nbsp;");

  const b = $("#boot"), log = $("#bootLog"); b.classList.remove("out"); b.hidden = false; $("#bootEmb").innerHTML = emblem(1.2); log.textContent = "";
  const lines = ["kernel 7.0.0-38-generic ................ ok", "nvidia 595.99.02 (open) ............... ok", "gpu0  Intel UHD Graphics (TGL GT1) ..... ok", "gpu1  NVIDIA GeForce GTX 1650 ......... ok", "compositor  wlroots 0.19.2 + scenefx .. ok", "shell  qt 6.10.2 ...................... ok", "skin  " + skin + " ".repeat(Math.max(1, 32 - skin.length)) + "ok"];
