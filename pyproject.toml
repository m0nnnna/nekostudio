[project]
name = "nekostudio"
version = "0.1.0"
description = "Local AI art studio: image + video generation, LoRA training, Pony prompt translator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "httpx", "python-multipart", "pillow"]

[project.scripts]
nekostudio = "nekostudio.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nekostudio*"]
